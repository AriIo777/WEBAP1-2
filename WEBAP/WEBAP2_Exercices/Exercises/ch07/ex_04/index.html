<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>7.4 Bookshelf</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <nav>
        <a href="#shelf">My shelf</a>
        <a href="#search">Find books</a>
    </nav>
    <p id="message" class="message"></p>
    <p id="loading">loading …</p>

    <section id="view-shelf" class="view">
        <h2>My shelf</h2>
        <p>
            <button class="status-filter" data-status="all">All</button>
            <button class="status-filter" data-status="want">Want to read</button>
            <button class="status-filter" data-status="reading">Reading</button>
            <button class="status-filter" data-status="read">Read</button>
        </p>
        <div id="shelf" class="cards"></div>
    </section>

    <section id="view-search" class="view">
        <h2>Find books</h2>
        <form id="searchForm">
            <input type="text" id="q" placeholder="Title or author" required>
            <button type="submit">Search</button>
        </form>
        <div id="results" class="cards"></div>
    </section>
</body>
</html>
